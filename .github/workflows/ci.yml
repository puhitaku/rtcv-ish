name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        if: hashFiles('web/package.json') != ''
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test the web frontend
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test --if-present
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: VERSION file
        run: |
          if ! grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' VERSION; then
            echo "::error file=VERSION::VERSION must hold one release tag such as v1.0.0 or v1.0.0-rc1"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [[ -n $unformatted ]]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go test
        run: go test ./...
